name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: make demo
      - run: make demo-compaction

  deploy:
    name: deploy landing page
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to Vercel production
        if: env.VERCEL_TOKEN != ''
        working-directory: site
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Skipped (no VERCEL_TOKEN secret)
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN secret is not set, landing page deploy skipped"
